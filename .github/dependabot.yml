# .github/dependabot.yml
# Catches CVEs in dependencies. Free, low-noise when grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # Wait before adopting a just-published release — the window when a
    # compromised/backdoored version is live before it's caught and yanked.
    # Patches move faster (usually the security fixes we want promptly).
    cooldown:
      default-days: 7
      semver-patch-days: 2
    groups:
      # Weekly version updates (Monday 06:00 UTC, per schedule above).
      prod-deps:
        applies-to: version-updates
        dependency-type: production
        # Every Stripe minor retypes the pinned apiVersion, so a grouped bump
        # fails type-check and holds back every other production update.
        exclude-patterns:
          - "stripe"
      dev-deps:
        applies-to: version-updates
        dependency-type: development
      # Security advisories — fold into grouped PRs instead of opening one
      # individual PR per CVE. Without these groups, security alerts trigger
      # out-of-band PRs that overlap with the next Monday's grouped batch
      # and create stale-PR cruft (e.g., #27 hono superseded by #32 prod-deps).
      prod-deps-security:
        applies-to: security-updates
        dependency-type: production
      dev-deps-security:
        applies-to: security-updates
        dependency-type: development
    ignore:
      # Prisma 7 moves datasource URL out of schema.prisma into prisma.config.ts.
      # Migration is non-trivial; pin until we explicitly do it.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # A Stripe SDK major moves to a new named API release, which carries
      # breaking changes for payment links and webhooks.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) doesn't support TS 7.0;
      # support is tracked for 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types must match the runtime major in the Dockerfile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    # Same rationale as the npm cooldown above — don't adopt a just-published
    # (possibly compromised) action release immediately.
    cooldown:
      default-days: 7
    groups:
      # Every codeql-action step must run the same version; bumped one at a
      # time, Analyze fails on the mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - github-actions

  # The Node runtime itself: npm advisories never cover it, so without this
  # the image sat on an end-of-life line with no alert.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    # Docker accepts no semver-* cooldown keys (one made this file invalid).
    # Majors are ignored below, so this short window is for Node patches.
    cooldown:
      default-days: 2
    ignore:
      # Moving to a new Node major is a deliberate LTS choice; Dependabot would
      # also offer odd-numbered Current lines that never get LTS support.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - docker
